workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part*
          include: true
          source: true
    # The Flutter project lives in a subdirectory of the repo, so every
    # Flutter/Xcode step needs to run there. Codemagic's default installer
    # otherwise looks for pubspec.yaml at /Users/builder/clone and fails
    # with "Failed to install dependencies... Directory was not found".
    working_directory: nova_token_drop
    scripts:
      - name: Set Flutter version
        script: |
          flutter --version
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Build iOS (no code sign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - flutter_drive.log

  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    working_directory: nova_token_drop
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
